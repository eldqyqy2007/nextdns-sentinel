name: Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile nextdns_sentinel.py sentinel_features.py
      - name: Smoke test feature store
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from sentinel_features import FeatureStore
          with tempfile.TemporaryDirectory() as d:
              store = FeatureStore(Path(d) / "test.db")
              store.heartbeat("ci")
              assert store.health()["healthy"]
          print("Sentinel feature-store smoke test passed")
          PY
